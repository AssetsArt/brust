[package]
name = "brust-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "brust v2 host-agnostic core: routing, manifest, render, caches' contracts and the request pipeline over a `Host`"

[features]
default = ["gzip"]
# Page/asset gzip. Off: `compress::gzip` is `None`, every page is served identity.
gzip = ["dep:flate2"]
# test-only: exports cache::conformance (brust-server dev-dep)
conformance = []

[dependencies]
brust-jinja.workspace = true
minijinja.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = "0.1"
http = "1"
bytes = "1"
matchit = "0.9"
percent-encoding = "2.3"
blake3 = "1"
flate2 = { version = "1", optional = true }

[lints]
workspace = true

# R5: the Workers clock (`host::JsClock`). No `unsafe-eval` (Workers forbids eval after startup), no
# `std` (futures-util). 0.3.106 resolves wasm-bindgen 0.2.129, the version `worker 0.8.7` pins.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { version = "0.3.106", default-features = false }
