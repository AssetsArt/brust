[package]
name    = "brust-core"
version = "0.1.0"
edition = "2024"

[lib]

[dependencies]
httparse          = "1"
parking_lot       = "0.12"
thiserror         = "2"
tracing           = "0.1"
once_cell         = "1"
matchit           = "0.9"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
moka              = { version = "0.12", features = ["sync"] }
flate2            = "1"
base64            = "0.22"
tokio-tungstenite = { version = "0.29", default-features = false }
sha1              = "0.11"
futures           = "0.3"
bytes             = "1"
minijinja         = "2"
jsx-rust-compiler = { path = "../jsx-rust-compiler" }
tokio             = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time", "fs"] }
hyper             = { version = "1", features = ["http1", "http2", "server"] }
hyper-util        = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util    = "0.1"
http-body         = "1"
http              = "1"
tokio-stream      = "0.1"

[dev-dependencies]
tempfile = "3"
