[package]
name    = "jsx-rust-compiler"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "jsx-rustc"
path = "src/bin/jsx-rustc.rs"

[dependencies]
swc_core  = { version = "68", features = ["ecma_ast", "ecma_parser_typescript", "ecma_visit", "common"] }
thiserror = "2"
serde_json = "1"
# The emission-contract filters (src/filters.rs) live in the lib so every
# render env registers the SAME definitions the compiler emits references to.
minijinja = "2"

[dev-dependencies]
pretty_assertions = "1"
