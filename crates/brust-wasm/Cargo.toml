[package]
name = "brust-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "brust v2 Cloudflare Workers host: workers-rs over brust-core"

[lib]
crate-type = ["cdylib"]

[dependencies]
brust-core = { path = "../brust-core", default-features = false }
http = "1"
bytes = "1"
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
worker = "=0.8.7"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = ["Request", "RequestInit", "Response", "ResponseInit", "Headers", "ReadableStream", "console"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[lints]
workspace = true
