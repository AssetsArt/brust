[package]
name = "brust-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "brust v2 HTTP server: manifest routing, L1/job caches, minijinja render, worker dispatch seam"

[dependencies]
brust-jinja.workspace = true
minijinja.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot = "0.12"
tracing = "0.1"
once_cell = "1"
matchit = "0.9"
percent-encoding = "2.3"
moka = { version = "0.12", features = ["sync"] }
flate2 = "1"
blake3 = "1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "fs"] }
tokio-stream = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = "0.3"
hyper = { version = "1", features = ["client"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# Render-path micro-bench on the real pokedex templates (plan m2p Task 1).
# `cargo bench -p brust-server --bench render`
[[bench]]
name = "render"
harness = false

[lints]
workspace = true
