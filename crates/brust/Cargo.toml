[package]
name    = "brust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
brust-core         = { path = "../brust-core" }
napi               = { version = "3", default-features = false, features = ["napi6", "async"] }
napi-derive        = "3"
parking_lot        = "0.12"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell          = "1"
serde_json         = "1"
jsx-rust-compiler  = { path = "../jsx-rust-compiler" }
tokio              = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time", "fs"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
napi-build = "2"
