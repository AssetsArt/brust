[package]
name    = "brust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi               = { version = "3", default-features = false, features = ["napi6", "async"] }
napi-derive        = "3"
httparse           = "1"
parking_lot        = "0.12"
thiserror          = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell          = "1"
flume              = "0.12"
matchit            = "0.9"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
moka               = { version = "0.12", features = ["sync"] }
flate2             = "1"
base64             = "0.22"
tokio-tungstenite  = { version = "0.29", default-features = false }
sha1               = "0.11"
futures            = "0.3"
bytes              = "1"
minijinja          = "2"
jsx-rust-compiler  = { path = "../jsx-rust-compiler" }
tokio              = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time", "fs"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
napi-build = "2"
