bun_threading.workspace = true
bstr.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
brust-jinja.workspace = true
minijinja.workspace = true
thiserror.workspace = true

[dev-dependencies]
brust-jinja.workspace = true

[lints]
workspace = true
