[workspace]
resolver = "2"
members = [
    "crates/brust",
]

# Workspace-level release profile applies to every member crate. Kept identical
# to the pre-workspace single-crate profile so the napi cdylib build output is
# unchanged (LTO + symbol strip + single codegen unit).
[profile.release]
lto           = true
strip         = "symbols"
codegen-units = 1
