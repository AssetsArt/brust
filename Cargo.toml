[package]
name    = "brust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi               = { version = "3", default-features = false, features = ["napi6", "async"] }
napi-derive        = "3"
httparse           = "1"
parking_lot        = "0.12"
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell          = "1"
flume              = "0.11"
matchit            = "0.8"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = "0.5"
tokio       = { version = "1", features = ["rt", "macros", "signal", "sync", "time"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tokio       = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync", "signal"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto         = true
strip       = "symbols"
codegen-units = 1
