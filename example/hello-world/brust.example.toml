# Example brust.toml. Copy to brust.toml at your project root and edit.
# Env vars BRUST_ADDR, BRUST_PORT and BRUST_WORKERS override any value here.

[server]
# Host/address to bind on. A hostname (resolved at bind time) or a literal IP
# such as "0.0.0.0" to listen on all interfaces. Default: "localhost".
address = "localhost"
# TCP port to bind on (1..65535). Default: 1337.
port = 1337

[workers]
# Bun Worker count for render dispatch.
# Default (omit this key): floor(os.availableParallelism() * 1.8).
# Pinning this is useful in containers where availableParallelism
# reports the host count, not the cgroup limit.
count = 18
