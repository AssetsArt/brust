[server]
address = "127.0.0.1"
port = 1337

[build]
server_only = ["lib/team-db"]

[actions]

# `brust build --target cloudflare` swaps the sqlite roster for the D1 one (the whole facade module).
[cloudflare.alias]
"lib/team-db.ts" = "lib/team-db.d1.ts"

# A shared second cache tier on Cloudflare (KV bodies + a Durable Object invalidation broadcast). Off by default.
# Needs: bun add @brust/cache-cloudflare, plus the KV and Durable Object bindings in wrangler.jsonc (see the comment there).
# [cache]
# adapter = "cloudflare-kv"
# broadcast = "cloudflare-do"
# epoch_interval_ms = 5000
#
# [cache.cloudflare]
# kv_min_ttl_s = 300
