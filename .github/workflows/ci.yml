name: ci
on:
  push: { branches: [v2] }
  pull_request: { branches: [v2] }
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: nightly-2026-09-15, components: "rust-src, rustfmt, clippy" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace
      # Invariant: the vendored path crate shadows the git one (only root lines are checked; bun_js_parser legitimately depends on it).
      - run: cargo tree -p brust-compiler -i bun_react_compiler | tee tree.txt && grep -q "^bun_react_compiler .*vendor/bun_react_compiler" tree.txt && ! grep -q "^bun_react_compiler .*github.com" tree.txt
      # --no-deps: the vendored Bun crate is not held to our lints (261 findings otherwise).
      - run: cargo clippy -p brust-compiler -p brust-compiler-cli -p brust-jinja --no-deps -- -D warnings
      # The dual-evaluation harness (tests/dual_eval.rs) runs generated jobs and
      # chunks under bun against packages/runtime-dom and happy-dom.
      - run: bun install --frozen-lockfile
      # --exclude: the vendored crate's own lib-test cannot link (its native stubs live in brust-compiler).
      - run: cargo test --workspace --exclude bun_react_compiler
      - run: bun build --no-bundle scripts/bun-codegen.ts > /dev/null
  runtime-dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p packages/runtime-dom
      - run: cd packages/runtime-dom && bun test
      - run: cd packages/runtime-dom && bun scripts/build.ts
