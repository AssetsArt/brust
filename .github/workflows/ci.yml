name: ci
# PR runs only (human decision 2026-10-10): the pull_request run already tests the PR merged into the
# current main, so a second run on the merge commit was pure duplication (5 wasted runs on 2026-10-10).
# Docs-only changes commit straight to main and never need CI; a PR that touches docs AND code still runs.
# workflow_dispatch is the manual escape hatch to run the whole suite on main (or any ref) on demand.
on:
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
# A new push to the same PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
# sccache cold start (L27b): the first run on a new key set loses many cache WRITES (the GHA cache service answers RateLimited to
# the hundreds of tiny entries five jobs create at once; keys themselves are stable run to run), so a cold run is slow and the next
# run is the warm one. Do not read the first run's hit rate as the steady state.
# sccache cannot cache incremental builds (workspace and path crates would always miss), so incremental is off for every job.
env:
  CARGO_INCREMENTAL: "0"
jobs:
  rust:
    runs-on: ubuntu-latest
    env: { SCCACHE_GHA_ENABLED: "true", RUSTC_WRAPPER: sccache }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: nightly-2026-09-15, components: "rust-src, rustfmt, clippy" }
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "canary" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-reg-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-reg-${{ runner.os }}-
      - run: cargo fmt --all -- --check
      # Invariant: the vendored path crate shadows the git one (only root lines are checked; bun_js_parser legitimately depends on it).
      - run: cargo tree -p brust-compiler -i bun_react_compiler | tee tree.txt && grep -q "^bun_react_compiler .*vendor/bun_react_compiler" tree.txt && ! grep -q "^bun_react_compiler .*github.com" tree.txt
      # Invariant: brust-core stays host-agnostic (no tokio/hyper/moka/crossbeam/parking_lot in its normal deps).
      - run: "! cargo tree -p brust-core -e normal | grep -E 'tokio|hyper|moka|crossbeam|parking_lot'"
      # --no-deps: the vendored Bun crate is not held to our lints (261 findings otherwise).
      - run: cargo clippy -p brust-core -p brust-compiler -p brust-compiler-cli -p brust-jinja -p brust-server -p brust-napi -p brust-wasm --no-deps -- -D warnings
      # brust-core builds for Cloudflare Workers (wasm32-unknown-unknown), with and without gzip.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check -p brust-core --target wasm32-unknown-unknown
      - run: cargo check -p brust-core --target wasm32-unknown-unknown --no-default-features
      - run: cargo clippy -p brust-core --target wasm32-unknown-unknown --no-default-features --no-deps -- -D warnings
      - run: "! cargo tree -p brust-core --target wasm32-unknown-unknown -e normal | grep -E 'tokio|hyper|moka|crossbeam|parking_lot|getrandom'"
      # brust-wasm (the Workers host) is held to the same lints on its real target.
      - run: cargo clippy -p brust-wasm --target wasm32-unknown-unknown --no-deps -- -D warnings
      # The dual-evaluation harness (tests/dual_eval.rs) runs generated jobs and
      # chunks under bun against packages/runtime-dom and happy-dom.
      - run: bun install --frozen-lockfile
      # --exclude: the vendored crate's own lib-test cannot link (its native stubs live in brust-compiler).
      - run: cargo test --workspace --exclude bun_react_compiler
      - run: bun build --no-bundle scripts/bun-codegen.ts > /dev/null
      - run: sccache --show-stats
        if: always()
  # M4-CF: ONE blocking job for every Cloudflare test. Order: the release-shape wasm first (a release-leg break shows on every PR),
  # then workerd e2e (cf-min + pokedex on D1, tests/cf), the build-target unit tests, and the scaffold --target cloudflare case.
  # No Cloudflare credentials: `deploy --dry-run` only; the real-edge proof is local-only.
  # Making `cf` a required check is a human branch-protection setting.
  cf:
    runs-on: ubuntu-latest
    needs: addon
    timeout-minutes: 45
    env: { SCCACHE_GHA_ENABLED: "true", RUSTC_WRAPPER: sccache }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: nightly-2026-09-15, components: "rust-src", targets: wasm32-unknown-unknown }
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-reg-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-reg-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "canary" }
      # worker-build's version has ONE source: npm/core-cf/package.json brust.workerBuild (core-cf-check --versions pins it to Cargo.toml).
      - id: wb
        run: echo "v=$(bun -e "console.log(require('./npm/core-cf/package.json').brust.workerBuild)")" >> "$GITHUB_OUTPUT"
      - id: wbc
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cache/worker-build
          key: worker-build-${{ runner.os }}-${{ steps.wb.outputs.v }}
      # Print what the cache gave us, so a miss is visible in the log; install only when the pinned version is not on PATH.
      - run: |
          echo "worker-build cache-hit=${{ steps.wbc.outputs.cache-hit }} have='$(worker-build --version 2>&1 | head -1)' want=${{ steps.wb.outputs.v }}"
          worker-build --version 2>/dev/null | grep -qF "${{ steps.wb.outputs.v }}" || cargo install worker-build --version "${{ steps.wb.outputs.v }}" --locked --force
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cf-${{ runner.os }}-${{ hashFiles('bun.lock', 'tests/cf/tools.ts', 'packages/create-app/templates/blank/package.json.tmpl') }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: addon-linux-x64, path: packages/brust/native }
      # The artifact must add files only: the tracked native/.gitignore stays untouched, the tree stays clean.
      - run: test -z "$(git status --porcelain)"
      # 1. the release-shape wasm (what release.yml build-core-cf runs) + its gate; the copy is the scaffold case's package source (R6).
      - run: |
          bun crates/brust-wasm/scripts/build.ts
          bun scripts/core-cf-check.ts npm/core-cf --pack --versions crates/brust-wasm/Cargo.toml
          cp -R npm/core-cf "$RUNNER_TEMP/core-cf"
      # 2. workerd e2e: cf-min (lane 3) and pokedex on local D1 (lane 5); rebuilds an --e2e wasm into npm/core-cf/worker (never published).
      - run: cd packages/cache-cloudflare && bun run typecheck && bun test
      - run: BRUST_CF_E2E=1 bun test --timeout 900000 tests/cf
      # 3. build-target unit tests (lane 4; fake core-cf fixture, no wasm). handlers/fetch-in-scope also run in the server job.
      - run: cd packages/brust && bun test test/cf-*.test.ts
      # 4. the scaffold case: blank from packed tarballs → `brust build --target cloudflare` (BRUST_CORE_CF_DIR unset in the app build) → wrangler deploy --dry-run.
      - run: cd packages/create-app && BRUST_CORE_CF_DIR="$RUNNER_TEMP/core-cf" bun test --timeout 600000 test/scaffold.test.ts -t cloudflare
      - run: sccache --show-stats
        if: always()
  runtime-dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "canary" }
      - run: bun install --frozen-lockfile
      - run: cd packages/runtime-dom && bun run typecheck
      - run: cd packages/runtime-dom && bun test
      # L33 R35.5: the core and every feature module stay within docs/runtime-budget.json (gzip); raise it in the PR that grows the runtime, with a reason.
      - run: cd packages/runtime-dom && bun scripts/size.ts --check
      - run: cd packages/runtime-dom && bun scripts/build.ts
  # The battery and the browser harness drive the real `brustc` (built in the job).
  battery:
    runs-on: ubuntu-latest
    needs: addon
    env: { SCCACHE_GHA_ENABLED: "true", RUSTC_WRAPPER: sccache }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: nightly-2026-09-15, components: "rust-src" }
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "canary" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-reg-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-reg-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run battery
      # The reports are generated: a diff means the committed ones are stale.
      - run: git diff --exit-code docs/react-coverage.md docs/react-coverage.json docs/reports/m1-exit-report.md
      # Exit criteria checked by code (also re-runs dual evaluation and the browser cases).
      - run: bun test scripts/battery
      # F386: every native/static row's served first HTML equals React's renderToString (the real `brust build` + `start`, one app,
      # a route per row); a diff or a server refusal fails unless scripts/battery/ssr-allowlist.ts explains it (wall time ~1 min).
      - uses: actions/download-artifact@v4
        with: { name: addon-linux-x64, path: packages/brust/native }
      - run: bun scripts/battery/ssr-compare.ts --check
      # F288 §3 (ruling Q1): the installed react-presence getElementRef on real React 19 elements (prod + dev) equals the fold.
      - run: bun test scripts/f288
      - run: sccache --show-stats
        if: always()
  browser:
    runs-on: ubuntu-latest
    env: { SCCACHE_GHA_ENABLED: "true", RUSTC_WRAPPER: sccache }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: nightly-2026-09-15, components: "rust-src" }
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "canary" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-reg-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-reg-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run browser-test
      - run: sccache --show-stats
        if: always()
  # ONE addon build per run (L27): server and cf download the artifact instead of compiling it again.
  # All jobs run on ubuntu-latest, so the .node is portable between them.
  addon:
    runs-on: ubuntu-latest
    env: { SCCACHE_GHA_ENABLED: "true", RUSTC_WRAPPER: sccache }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: nightly-2026-09-15, components: "rust-src" }
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "canary" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-reg-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-reg-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: cd packages/brust && bun run build:debug
      - uses: actions/upload-artifact@v4
        with: { name: addon-linux-x64, path: packages/brust/native, retention-days: 1, if-no-files-found: error }
      - run: sccache --show-stats
        if: always()
  # @brust/core: the napi addon (built with `napi build` on this runner), the package's unit
  # tests and the end-to-end run of the real CLI (build the fixture app, start it, assert from the
  # outside). The addon itself comes from the `addon` job (artifact); this job compiles no Rust.
  server:
    runs-on: ubuntu-latest
    needs: addon
    timeout-minutes: 60
    # cache-redis: the adapter's suites run against real servers; REQUIRED makes a missing URL a failure, not a skip.
    services:
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2
        ports: ["6380:6379"]
        options: --ulimit memlock=-1
    env: { BRUST_REDIS_URL: "redis://127.0.0.1:6379", BRUST_DRAGONFLY_URL: "redis://127.0.0.1:6380", BRUST_REDIS_REQUIRED: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "canary" }
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: addon-linux-x64, path: packages/brust/native }
      # The artifact must add files only: the tracked native/.gitignore stays untouched, the tree stays clean.
      - run: test -z "$(git status --porcelain)"
      - run: cd packages/brust && bun run typecheck
      # The shadcn scoreboard (docs/shadcn-coverage.md) is generated: a stale doc fails here, like the battery's reports.
      - run: bun scripts/shadcn/run.ts --check && bun test scripts/shadcn
      # Exact raw + gzip client JS per shadcn page (the doc only carries KB): not committed, kept for review.
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shadcn-sizes, path: tests/fixtures/shadcn/.rows/shadcn-sizes.json, retention-days: 14, if-no-files-found: ignore }
      # Unit files together; each server-starting file on its own (port/process hygiene).
      - run: cd packages/brust && bun test test/routes.test.ts test/cache.test.ts test/worker.test.ts test/config.test.ts test/napi-compile.test.ts test/build-compile.test.ts test/store-server-context.test.ts test/worker-store.test.ts test/actions-elysia.test.ts test/actions-load.test.ts test/actions-client.test.ts test/build-config-actions.test.ts test/config-cors.test.ts test/run-options.test.ts test/actions-bridge.test.ts test/cache-adapter-memory.test.ts test/cache-adapter-bridge.test.ts test/cache-adapter-runtime.test.ts test/build-config-cache.test.ts test/build-cache.test.ts test/ssg.test.ts test/dev-unit.test.ts test/config-l10.test.ts test/pkg-src.test.ts test/runtime-features.test.ts test/idle-workers.test.ts test/build-job-import.test.ts test/pkg-src-dist.test.ts test/resolver-followups.test.ts test/source-roots.test.ts
      - run: cd packages/brust && bun test test/napi-server.test.ts
      - run: cd packages/brust && bun test test/build-manifest.test.ts
      - run: cd packages/brust && bun test --timeout 180000 test/build-cn-fold.test.ts
      - run: cd packages/brust && bun test --timeout 180000 test/live-style-real.test.ts
      # F155 (R37): one React and one react-dom per target (Bun, Cloudflare client + Worker, static), staged-import
      # resolution, and the symlinked-root cases. Was not wired into CI when it landed.
      - run: cd packages/brust && bun test --timeout 180000 test/esm-resolve.test.ts
      # F197: helpers imported from packages proven through .brust/pkg-src (builds with bin/brust and serves the page).
      - run: cd packages/brust && bun test --timeout 180000 test/package-helpers.test.ts
      # F148a (R34.124): the hostile-input set for the island revive, with the build tests of the lowered children it guards
      # (build-island-children, build-island-slots and build-props-pattern were not run here before).
      - run: cd packages/brust && bun test --timeout 180000 test/prop-path-children-revive.test.ts test/build-prop-path-children.test.ts test/build-island-children.test.ts test/build-island-slots.test.ts test/build-props-pattern.test.ts
      - run: cd packages/brust && bun test test/cli.test.ts
      - run: cd packages/brust && bun test test/attr-parity-react.test.ts
      - run: cd packages/brust && bun test test/shadcn-init.test.ts
      # F226/F227: tsconfig extends/paths folding for the init target check.
      - run: cd packages/brust && bun test test/shadcn-init-extends.test.ts
      # F228: registry URL item vetting; starts a local Bun.serve, so it runs alone.
      - run: cd packages/brust && bun test test/shadcn-init-registry.test.ts
      # F252/F253: the init module is loaded only by `brust shadcn init`; the spawned CLI gets no TS_NODE_* variables. Spawns brust, runs alone.
      - run: cd packages/brust && bun test --timeout 60000 test/shadcn-init-lazy.test.ts
      - run: cd packages/brust && bun test --timeout 120000 test/e2e.test.ts
      - run: cd packages/brust && bun test --timeout 120000 test/e2e-child-literals.test.ts
      - run: cd packages/brust && bun test test/build-store.test.ts
      - run: cd packages/brust && bun test --timeout 120000 test/e2e-store.test.ts
      - run: cd packages/brust && bun test --timeout 120000 test/e2e-actions.test.ts
      - run: cd packages/brust && bun test test/build-actions.test.ts
      - run: cd packages/brust && bun test test/actions-napi.test.ts
      - run: cd packages/brust && bun test test/handlers.test.ts test/fetch-in-scope.test.ts
      # gaps round L9: brust build --target static, end to end on test/fixtures/static-app.
      - run: cd packages/brust && bun test --timeout 300000 test/static.test.ts
      # gaps round L19: CSS (global, modules, injection) end to end on test/fixtures/css-app.
      - run: cd packages/brust && bun test --timeout 300000 test/css.test.ts
      # gaps round L21 + L32: Tailwind CSS v4 (brust's plugin over the repo's pinned tailwindcss, @tailwindcss/node, @tailwindcss/oxide).
      - run: cd packages/brust && bun test --timeout 300000 test/tailwind.test.ts
      # m2e: the pokedex dogfood (spec §10). Each server-starting file runs alone.
      - run: cd examples/pokedex && bun test
      - run: cd examples/pokedex && bun run typecheck
      # m3f-create-app: unit + pack, then the scaffold run (packs core/runtime-dom, bun install from npm, build, start) on its own.
      - run: cd packages/create-app && bun run typecheck && bun test test/args.test.ts test/copy.test.ts test/dep.test.ts test/templates.test.ts test/cli.test.ts test/shadcn.test.ts test/sync-template.test.ts test/pack.test.ts test/tailwind.test.ts
      - run: cd packages/create-app && bun test --timeout 600000 test/scaffold.test.ts
      - run: bunx playwright install --with-deps chromium
      # website/: the docs site (TSX pages on the workspace @brust/core); several files drive Chromium, so it runs after
      # the browser install, and each file runs alone (each starts its own server; a combined run raced on ports).
      - run: cd website && bun run typecheck && for f in test/*.test.ts; do bun test --timeout 180000 "$f" || exit 1; done
      - run: bun test --timeout 120000 tests/server/pokedex.test.ts
      - run: bun test --timeout 120000 tests/server/cache-adapter.test.ts
      - run: bun test --timeout 120000 tests/server/inner-html.test.ts
      - run: bun test --timeout 180000 tests/server/nonascii.chromium.test.ts
      - run: bun test --timeout 180000 tests/server/dev.chromium.test.ts
      - run: bun test --timeout 180000 tests/server/dev-lifecycle.chromium.test.ts
      - run: bun test --timeout 180000 tests/server/dev-trace.chromium.test.ts
      - run: bun test --timeout 180000 tests/server/devtools.chromium.test.ts
      - run: cd packages/cache-redis && bun run typecheck && bun test
      - run: bun test --timeout 180000 tests/server/cache-redis.test.ts
      - run: bun test --timeout 120000 tests/server/hydrate.chromium.test.ts
      - run: bun test --timeout 120000 tests/server/lucide.chromium.test.ts
      - run: bun test --timeout 120000 tests/server/external-island.chromium.test.ts tests/server/static.chromium.test.ts tests/server/list-cond.chromium.test.ts
      - run: bun test --timeout 120000 tests/server/island-in-inlined.chromium.test.ts
      - run: bun test --timeout 120000 tests/server/named-export-islands.chromium.test.ts
      - run: bun test --timeout 120000 tests/server/island-children.chromium.test.ts
      - run: bun test --timeout 180000 tests/server/island-layout-context.test.ts
      - run: bun test --timeout 180000 tests/server/js-operators.test.ts
      - run: bun test --timeout 120000 tests/server/island-slots.chromium.test.ts
      - run: bun test --timeout 120000 tests/server/prop-path-children.chromium.test.ts
      - run: bun test --timeout 120000 tests/server/hydration-timing.chromium.test.ts
      - run: bun test --timeout 120000 tests/server/object-literal-arrow.chromium.test.ts
      - run: bun test --timeout 120000 tests/server/event-aria.chromium.test.ts
      - run: bun test --timeout 120000 tests/server/live-style.chromium.test.ts
      - run: bun test --timeout 120000 tests/server/props-order.chromium.test.ts
      - run: bun test --timeout 120000 tests/server/loader-style.chromium.test.ts
      - run: bun test --timeout 120000 tests/server/bind-parity.chromium.test.ts
      - run: bun test --timeout 120000 tests/server/icon-shapes.test.ts
      - run: bun test --timeout 120000 tests/server/nested-fed.test.ts
      # F284-F287: an arrow-const component, useReducer, hoisted hooks and includes: served == React, then the interaction.
      - run: bun test --timeout 120000 tests/server/presence-general.chromium.test.ts
      # F289: a hook's returned object bound whole at the call site (t.on / t.toggle): served == React, then the clicks.
      - run: bun test --timeout 120000 tests/server/hook-object-bind.chromium.test.ts
      # F388: a falsy number left of `&&` paints as React does (0, NaN), server and client: served == React, flips.
      - run: bun test --timeout 120000 tests/server/falsy-and.chromium.test.ts
      # F384: `{cond && children}` / `{cond ? children : null}`, plain and in a Provider clone: served == React, toggles.
      - run: bun test --timeout 120000 tests/server/cond-children.chromium.test.ts
      # F385: an inlined custom hook's argument is set before what reads it (template, job, chunk): served == React.
      - run: bun test --timeout 120000 tests/server/preamble-order.chromium.test.ts
      # F308: a changing key outside a list is a named refusal; the React page resets state on a key change.
      - run: bun test --timeout 120000 tests/server/live-key.chromium.test.ts
      # F369c: a handler spread into a native child's element is bound by that element (x-prop-on-*), read live.
      - run: bun test --timeout 120000 tests/server/native-spread-handler.chromium.test.ts
      # F412: native list rows printed hidden before the shown one: served and static == React, no warning, no stray row.
      - run: bun test --timeout 120000 tests/server/list-first-paint.chromium.test.ts
      # F431: object-literal context defaults at the page are native (v.a, {a, b}, a fed child); nested / inline Provider fall back.
      - run: bun test --timeout 120000 tests/server/ctx-object-defaults.chromium.test.ts
      # shadcn S1.3: handlers forwarded through shadcn spreads (fixture tests/fixtures/shadcn/handlers).
      - run: bun test --timeout 120000 tests/server/spread-handlers.chromium.test.ts
      # F142 PR 1: shadcn's table page built AND started, its HTML equal to React's.
      - run: bun test --timeout 120000 tests/server/per-instance-jobs.test.ts
      - run: bun test --timeout 120000 tests/server/body-destructure.test.ts
      - run: bun test --timeout 120000 tests/server/forwardref.test.ts
      # F165: an all-static app starts with no worker (tests/fixtures/shadcn/started/idle-workers).
      - run: bun test --timeout 180000 tests/server/idle-workers.test.ts
      # F153c: shadcn's Label compiled from @radix-ui/react-label's source map (no island), HTML and behaviour as React's.
      - run: bun test --timeout 180000 tests/server/package-source.chromium.test.ts
      - run: bun test --timeout 180000 tests/server/toggle-live.chromium.test.ts
