name: ci
# PR runs only (human decision 2026-10-10): the pull_request run already tests the PR merged into the
# current main, so a second run on the merge commit was pure duplication (5 wasted runs on 2026-10-10).
# Docs-only changes commit straight to main and never need CI; a PR that touches docs AND code still runs.
# workflow_dispatch is the manual escape hatch to run the whole suite on main (or any ref) on demand.
# F478: a PR that touches nothing but website/ (and the ignored docs) runs `changes`, `addon` and `website` only; every other job is
# skipped, so the run still concludes success. Any other path (.github/, packages/, crates/, the lockfile ...) runs everything.
on:
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
# A new push to the same PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
# sccache cold start (L27b): the first run on a new key set loses many cache WRITES (the GHA cache service answers RateLimited to
# the hundreds of tiny entries five jobs create at once; keys themselves are stable run to run), so a cold run is slow and the next
# run is the warm one. Do not read the first run's hit rate as the steady state.
# sccache cannot cache incremental builds (workspace and path crates would always miss), so incremental is off for every job.
env:
  CARGO_INCREMENTAL: "0"
jobs:
  # F478: does this PR touch anything but website/? `code` gates every job below except addon and website. On a PR the checkout is the
  # merge commit, so HEAD^1..HEAD is exactly the PR's diff against the current main. Anything else (workflow_dispatch, a checkout that
  # is not a merge) counts as code: the heavy jobs are skipped only when this job proves the diff is website-only.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: diff
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git rev-parse --verify -q HEAD^2 > /dev/null; then
            code=false
            files="$(git diff --name-only HEAD^1 HEAD)"
            echo "$files"
            while IFS= read -r f; do
              case "$f" in
                "") ;;
                website/* | docs/* | *.md) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
  rust:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env: { SCCACHE_GHA_ENABLED: "true", RUSTC_WRAPPER: sccache }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: nightly-2026-09-15, components: "rust-src, rustfmt, clippy" }
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.4" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-reg-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-reg-${{ runner.os }}-
      - run: cargo fmt --all -- --check
      # F477: Cargo.lock is current. A manifest change cargo would have to write into the lock (a missing edge) fails here, not as a dirty tree after a build.
      - run: cargo metadata --locked --format-version 1 > /dev/null
      # Invariant: the vendored path crate shadows the git one (only root lines are checked; bun_js_parser legitimately depends on it).
      - run: cargo tree -p brust-compiler -i bun_react_compiler | tee tree.txt && grep -q "^bun_react_compiler .*vendor/bun_react_compiler" tree.txt && ! grep -q "^bun_react_compiler .*github.com" tree.txt
      # Invariant: brust-core stays host-agnostic (no tokio/hyper/moka/crossbeam/parking_lot in its normal deps).
      - run: "! cargo tree -p brust-core -e normal | grep -E 'tokio|hyper|moka|crossbeam|parking_lot'"
      # --no-deps: the vendored Bun crate is not held to our lints (261 findings otherwise).
      - run: cargo clippy -p brust-core -p brust-compiler -p brust-compiler-cli -p brust-jinja -p brust-server -p brust-napi -p brust-wasm --no-deps -- -D warnings
      # brust-core builds for Cloudflare Workers (wasm32-unknown-unknown), with and without gzip.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check -p brust-core --target wasm32-unknown-unknown
      - run: cargo check -p brust-core --target wasm32-unknown-unknown --no-default-features
      - run: cargo clippy -p brust-core --target wasm32-unknown-unknown --no-default-features --no-deps -- -D warnings
      - run: "! cargo tree -p brust-core --target wasm32-unknown-unknown -e normal | grep -E 'tokio|hyper|moka|crossbeam|parking_lot|getrandom'"
      # brust-wasm (the Workers host) is held to the same lints on its real target.
      - run: cargo clippy -p brust-wasm --target wasm32-unknown-unknown --no-deps -- -D warnings
      # The dual-evaluation harness (tests/dual_eval.rs) runs generated jobs and
      # chunks under bun against packages/runtime-dom and happy-dom.
      - run: bun install --frozen-lockfile
      # --exclude: the vendored crate's own lib-test cannot link (its native stubs live in brust-compiler).
      - run: cargo test --workspace --exclude bun_react_compiler
      - run: bun build --no-bundle scripts/bun-codegen.ts > /dev/null
      - run: sccache --show-stats
        if: always()
  # M4-CF: ONE blocking job for every Cloudflare test. Order: the release-shape wasm first (a release-leg break shows on every PR),
  # then workerd e2e (cf-min + pokedex on D1, tests/cf), the build-target unit tests, and the scaffold --target cloudflare case.
  # No Cloudflare credentials: `deploy --dry-run` only; the real-edge proof is local-only.
  # Making `cf` a required check is a human branch-protection setting.
  cf:
    runs-on: ubuntu-latest
    needs: [addon, changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 45
    env: { SCCACHE_GHA_ENABLED: "true", RUSTC_WRAPPER: sccache }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: nightly-2026-09-15, components: "rust-src", targets: wasm32-unknown-unknown }
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-reg-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-reg-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.4" }
      # worker-build's version has ONE source: npm/core-cf/package.json brust.workerBuild (core-cf-check --versions pins it to Cargo.toml).
      - id: wb
        run: echo "v=$(bun -e "console.log(require('./npm/core-cf/package.json').brust.workerBuild)")" >> "$GITHUB_OUTPUT"
      - id: wbc
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cache/worker-build
          key: worker-build-${{ runner.os }}-${{ steps.wb.outputs.v }}
      # Print what the cache gave us, so a miss is visible in the log; install only when the pinned version is not on PATH.
      - run: |
          echo "worker-build cache-hit=${{ steps.wbc.outputs.cache-hit }} have='$(worker-build --version 2>&1 | head -1)' want=${{ steps.wb.outputs.v }}"
          worker-build --version 2>/dev/null | grep -qF "${{ steps.wb.outputs.v }}" || cargo install worker-build --version "${{ steps.wb.outputs.v }}" --locked --force
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cf-${{ runner.os }}-${{ hashFiles('bun.lock', 'tests/cf/tools.ts', 'packages/create-app/templates/blank/package.json.tmpl') }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: addon-linux-x64, path: packages/brust/native }
      # The artifact must add files only: the tracked native/.gitignore stays untouched, the tree stays clean.
      - run: test -z "$(git status --porcelain)"
      # 1. the release-shape wasm (what release.yml build-core-cf runs) + its gate; the copy is the scaffold case's package source (R6).
      - run: |
          bun crates/brust-wasm/scripts/build.ts
          bun scripts/core-cf-check.ts npm/core-cf --pack --versions crates/brust-wasm/Cargo.toml
          cp -R npm/core-cf "$RUNNER_TEMP/core-cf"
      # 2. workerd e2e: cf-min (lane 3) and pokedex on local D1 (lane 5); rebuilds an --e2e wasm into npm/core-cf/worker (never published).
      - run: cd packages/cache-cloudflare && bun run typecheck && bun test
      - run: BRUST_CF_E2E=1 bun test --timeout 900000 tests/cf
      # 3. build-target unit tests (lane 4; fake core-cf fixture, no wasm). handlers/fetch-in-scope also run in the server job.
      - run: cd packages/brust && bun test test/cf-*.test.ts
      # 4. the scaffold case: blank from packed tarballs → `brust build --target cloudflare` (BRUST_CORE_CF_DIR unset in the app build) → wrangler deploy --dry-run.
      - run: cd packages/create-app && BRUST_CORE_CF_DIR="$RUNNER_TEMP/core-cf" bun test --timeout 600000 test/scaffold.test.ts -t cloudflare
      - run: sccache --show-stats
        if: always()
  runtime-dom:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.4" }
      - run: bun install --frozen-lockfile
      - run: cd packages/runtime-dom && bun run typecheck
      - run: cd packages/runtime-dom && bun test
      # L33 R35.5: the core and every feature module stay within docs/runtime-budget.json (gzip); raise it in the PR that grows the runtime, with a reason.
      - run: cd packages/runtime-dom && bun scripts/size.ts --check
      - run: cd packages/runtime-dom && bun scripts/build.ts
  # The battery and the browser harness drive the real `brustc` (built in the job).
  battery:
    runs-on: ubuntu-latest
    needs: [addon, changes]
    if: needs.changes.outputs.code == 'true'
    env: { SCCACHE_GHA_ENABLED: "true", RUSTC_WRAPPER: sccache }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: nightly-2026-09-15, components: "rust-src" }
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.4" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-reg-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-reg-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run battery
      # The reports are generated: a diff means the committed ones are stale.
      - run: git diff --exit-code docs/react-coverage.md docs/react-coverage.json docs/reports/m1-exit-report.md
      # Exit criteria checked by code (also re-runs dual evaluation and the browser cases).
      - run: bun test scripts/battery
      # F386: every native/static row's served first HTML equals React's renderToString (the real `brust build` + `start`, one app,
      # a route per row); a diff or a server refusal fails unless scripts/battery/ssr-allowlist.ts explains it (wall time ~1 min).
      - uses: actions/download-artifact@v4
        with: { name: addon-linux-x64, path: packages/brust/native }
      - run: bun scripts/battery/ssr-compare.ts --check
      # F288 §3 (ruling Q1): the installed react-presence getElementRef on real React 19 elements (prod + dev) equals the fold.
      - run: bun test scripts/f288
      - run: sccache --show-stats
        if: always()
  browser:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env: { SCCACHE_GHA_ENABLED: "true", RUSTC_WRAPPER: sccache }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: nightly-2026-09-15, components: "rust-src" }
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.4" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-reg-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-reg-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run browser-test
      - run: sccache --show-stats
        if: always()
  # ONE addon build per run (L27): server and cf download the artifact instead of compiling it again.
  # All jobs run on ubuntu-latest, so the .node is portable between them.
  addon:
    runs-on: ubuntu-latest
    env: { SCCACHE_GHA_ENABLED: "true", RUSTC_WRAPPER: sccache }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: nightly-2026-09-15, components: "rust-src" }
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.4" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-reg-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-reg-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: cd packages/brust && bun run build:debug
      - uses: actions/upload-artifact@v4
        with: { name: addon-linux-x64, path: packages/brust/native, retention-days: 1, if-no-files-found: error }
      - run: sccache --show-stats
        if: always()
  # F484/F486: Windows x64 (x86_64-pc-windows-msvc): the RELEASE addon links and loads, the compiler/unit/CLI tests that need no Linux-only
  # tooling pass, and scripts/windows-smoke.ts proves scaffold -> build -> start -> fetch -> stop -> rebuild on a non-ASCII path.
  # aws-lc-sys uses its prebuilt NASM objects.
  windows:
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 60
    defaults: { run: { shell: bash } }
    env: { SCCACHE_GHA_ENABLED: "true", RUSTC_WRAPPER: sccache, AWS_LC_SYS_PREBUILT_NASM: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: nightly-2026-09-15, components: "rust-src", targets: x86_64-pc-windows-msvc }
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.4" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-reg-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-reg-${{ runner.os }}-
      # C1: the checkout must be byte-identical to Linux's (.gitattributes eol=lf), or the snapshot tests below fail here first.
      - run: bun install --frozen-lockfile
      # F486: the RELEASE command release.yml uses for this target (windows-native built debug only); this job folds the old
      # `windows-native` link check in: a link failure (LNK2019/LNK1120) after a Bun crates bump shows up here. Regenerate
      # crates/brust-compiler/src/parse/stubs/windows.rs from this job's log with crates/brust-compiler/scripts/gen-win-stubs.ts (plan A3).
      - run: cd packages/brust && bun run build:target --target x86_64-pc-windows-msvc
      - run: ls -l packages/brust/native && test -f packages/brust/native/brust.win32-x64-msvc.node
      # The generated loader picks the win32-x64-msvc binary and the addon's exports are there.
      - run: bun -e "const k = Object.keys(require('./packages/brust/native/index.js')).sort(); if (!k.includes('compileTree') || !k.includes('startServer')) process.exit(1); console.log(k.join(' '))"
      # The 7 natives release-check/dep tests (platform list, 6 -> 7).
      - run: bun test scripts/release-check.test.ts packages/create-app/test/dep.test.ts
      - run: cargo test -p brust-compiler
      # packages/brust and create-app test files on Windows. scripts/ci-wiring.test.ts fails when a test file of either package
      # is neither run by a windows job nor named in a `# windows-skip: <path> <reason>` line below (F489). tests/server/* stay
      # Linux-only (Chromium, redis, workerd); scripts/windows-smoke.ts covers scaffold -> build -> start here.
      # windows-skip: packages/brust/test/cf-dev.test.ts the fake wrangler is a #!/bin/sh script and the test drives the SIGTERM restart (POSIX-only)
      # windows-skip: packages/brust/test/lifecycle.test.ts SIGTERM drain is POSIX-only (F486 C4); Windows stop is lane win-stop (F488)
      # windows-skip: packages/brust/test/static-csp.test.ts starts and stops `brust start` per case to read the served policy (the Windows server child outlives the stop for up to 1 s, F488) and the build output is the same on every OS
      # windows-skip: packages/create-app/test/shadcn.test.ts the round trips run the printed lines through a real sh and #!/bin/sh stubs (POSIX shell)
      # windows-skip: packages/create-app/test/pack.test.ts asserts the tarball's exec bit and lists it with sh/tar (the exec bit is POSIX-only)
      # windows-skip: packages/create-app/test/scaffold.test.ts npm install of workerd and the cloudflare cases; scripts/windows-smoke.ts covers the scaffold
      - run: cd packages/brust && bun run typecheck
      - run: cd packages/brust && bun test test/win-paths.test.ts test/launcher-watch.test.ts test/routes.test.ts test/config.test.ts test/napi-compile.test.ts test/build-compile.test.ts test/build-config-actions.test.ts test/config-cors.test.ts test/config-csp.test.ts test/build-config-cache.test.ts test/build-cache.test.ts test/ssg.test.ts test/dev-unit.test.ts test/config-l10.test.ts test/pkg-src.test.ts test/source-roots.test.ts test/build-server-only.test.ts test/build-store.test.ts test/build-actions.test.ts test/handlers.test.ts
      - run: cd packages/brust && bun test test/cli.test.ts
      - run: cd packages/brust && bun test --timeout 120000 test/e2e.test.ts
      # F489: the rest, each file alone (several start a server or build a fixture app; one process per file keeps ports and dirs apart).
      - run: cd packages/brust && for f in test/actions-bridge.test.ts test/actions-client-middleware.test.ts test/actions-client.test.ts test/actions-elysia.test.ts test/actions-load.test.ts test/actions-napi.test.ts test/actions-standalone.test.ts test/actions-typed-cookies.test.ts test/actions-typed-routes-doc.test.ts test/attr-parity-react.test.ts test/base-path-served.test.ts test/base-path.test.ts test/build-cn-fold.test.ts test/build-concurrent.test.ts test/build-eval.test.ts test/build-expose.test.ts test/build-island-children.test.ts test/rc-island-render.test.ts test/island-shim-commit.test.ts test/build-island-slots.test.ts test/build-job-import.test.ts test/build-manifest-stores.test.ts test/build-manifest.test.ts test/build-member-import.test.ts test/build-named-islands.test.ts test/build-prop-path-children.test.ts test/build-props-pattern.test.ts test/build-safety.test.ts test/build-undefined-slot.test.ts test/cache-adapter-bridge.test.ts test/cache-adapter-memory.test.ts test/cache-adapter-runtime.test.ts test/cache.test.ts test/cf-assets.test.ts test/cf-build.test.ts test/cf-cache-bindings.test.ts test/cf-config.test.ts test/cf-core.test.ts test/cf-entry.test.ts test/cf-wrangler.test.ts test/compile-component.test.ts test/compile-facts.test.ts test/css-module-fold.test.ts test/css.test.ts test/dev-proxy-actions.test.ts test/dev-proxy-inject.test.ts test/dev-proxy-ws.test.ts test/e2e-actions.test.ts test/e2e-child-chunks.test.ts test/e2e-child-literals.test.ts test/e2e-external-island.test.ts test/e2e-module-const.test.ts test/e2e-store.test.ts test/esm-resolve.test.ts test/fetch-in-scope.test.ts test/font-import.test.ts test/idle-workers.test.ts test/live-style-real.test.ts test/load-writer-chain.test.ts test/load-writer-handed.test.ts test/lucide-native.test.ts test/napi-server.test.ts test/navigate.test.ts test/navigation-store.test.ts test/package-helpers.test.ts test/package-name.test.ts test/pkg-src-dist.test.ts test/prop-path-children-revive.test.ts test/react-cache-start.test.ts test/resolver-followups.test.ts test/run-options.test.ts test/runtime-features.test.ts test/shadcn-init-extends.test.ts test/shadcn-init-lazy.test.ts test/shadcn-init-registry.test.ts test/shadcn-init.test.ts test/state-from-children.test.ts test/static-actions.test.ts test/static.test.ts test/store-exports.test.ts test/store-server-context.test.ts test/tailwind.test.ts test/trailing-slash.test.ts test/tsconfig-paths.test.ts test/win-ctrl-break.test.ts test/worker-store.test.ts test/worker.test.ts test/ws-adapter.test.ts; do bun test --timeout 180000 "$f" || exit 1; done
      - run: cd packages/create-app && bun run typecheck && bun test test/args.test.ts test/copy.test.ts test/dep.test.ts test/templates.test.ts test/tailwind.test.ts test/sync-template.test.ts test/cli.test.ts
      # C2 + A2(4): scaffold -> build -> start -> fetch -> stop -> rebuild, in a non-ASCII dir with Thai text. A reached Windows stub aborts by name and fails here.
      - run: bun scripts/windows-smoke.ts
      - run: sccache --show-stats
        if: always()
  # F478: the docs site (website/) on its own, so a website-only PR does not run the server job. It runs on every PR: the site is
  # TSX pages on the workspace @brust/core, so it takes the addon artifact like server does.
  website:
    runs-on: ubuntu-latest
    needs: [addon, changes]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.4" }
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: addon-linux-x64, path: packages/brust/native }
      # The artifact must add files only: the tracked native/.gitignore stays untouched, the tree stays clean.
      - run: test -z "$(git status --porcelain)"
      # Pinned to the playwright version in bun.lock (tests/server, website): an unpinned bunx fetches the npm latest,
      # whose browser build is not the one the locked package launches.
      - run: bunx playwright@1.64.0 install --with-deps chromium
      # website/: the docs site (TSX pages on the workspace @brust/core); several files drive Chromium, so it runs after
      # the browser install, and each file runs alone (each starts its own server; a combined run raced on ports).
      - run: cd website && bun run typecheck && for f in test/*.test.ts; do bun test --timeout 180000 "$f" || exit 1; done
  # @brust/core: the napi addon (built with `napi build` on this runner), the package's unit
  # tests and the end-to-end run of the real CLI (build the fixture app, start it, assert from the
  # outside). The addon itself comes from the `addon` job (artifact); this job compiles no Rust.
  server:
    runs-on: ubuntu-latest
    needs: [addon, changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 60
    # cache-redis: the adapter's suites run against real servers; REQUIRED makes a missing URL a failure, not a skip.
    services:
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2
        ports: ["6380:6379"]
        options: --ulimit memlock=-1
