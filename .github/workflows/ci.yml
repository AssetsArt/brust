name: ci
on:
  push: { branches: [v2] }
  pull_request: { branches: [v2] }
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: nightly-2026-09-15, components: "rust-src, rustfmt, clippy" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace
      # Invariant: the vendored path crate shadows the git one (only root lines are checked; bun_js_parser legitimately depends on it).
      - run: cargo tree -p brust-compiler -i bun_react_compiler | tee tree.txt && grep -q "^bun_react_compiler .*vendor/bun_react_compiler" tree.txt && ! grep -q "^bun_react_compiler .*github.com" tree.txt
      # --no-deps: the vendored Bun crate is not held to our lints (261 findings otherwise).
      - run: cargo clippy -p brust-compiler -p brust-compiler-cli -p brust-jinja -p brust-server -p brust-napi --no-deps -- -D warnings
      # The dual-evaluation harness (tests/dual_eval.rs) runs generated jobs and
      # chunks under bun against packages/runtime-dom and happy-dom.
      - run: bun install --frozen-lockfile
      # --exclude: the vendored crate's own lib-test cannot link (its native stubs live in brust-compiler).
      - run: cargo test --workspace --exclude bun_react_compiler
      - run: bun build --no-bundle scripts/bun-codegen.ts > /dev/null
  runtime-dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - run: bun install --frozen-lockfile
      - run: cd packages/runtime-dom && bun run typecheck
      - run: cd packages/runtime-dom && bun test
      - run: cd packages/runtime-dom && bun scripts/build.ts
  # The battery and the browser harness drive the real `brustc` (built in the job).
  battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: nightly-2026-09-15, components: "rust-src" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run battery
      # The reports are generated: a diff means the committed ones are stale.
      - run: git diff --exit-code docs/react-coverage.md docs/plans/m1-exit-report.md
      # Exit criteria checked by code (also re-runs dual evaluation and the browser cases).
      - run: bun test scripts/battery
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: nightly-2026-09-15, components: "rust-src" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run browser-test
  # @brust/core: the napi addon (built with `napi build` on this runner), the package's unit
  # tests and the end-to-end run of the real CLI (build the fixture app, start it, assert from the
  # outside). A cold addon build compiles the Bun crates (~10+ min): the cargo cache is shared.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: nightly-2026-09-15, components: "rust-src, clippy" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: cargo clippy -p brust-napi --no-deps -- -D warnings && cargo test -p brust-napi
      - run: cd packages/brust && bun run build:debug
      - run: cd packages/brust && bun run typecheck
      # Unit files together; each server-starting file on its own (port/process hygiene).
      - run: cd packages/brust && bun test test/routes.test.ts test/cache.test.ts test/worker.test.ts test/config.test.ts test/napi-compile.test.ts test/build-compile.test.ts
      - run: cd packages/brust && bun test test/napi-server.test.ts
      - run: cd packages/brust && bun test test/build-manifest.test.ts
      - run: cd packages/brust && bun test test/cli.test.ts
      - run: cd packages/brust && bun test --timeout 120000 test/e2e.test.ts
      # m2e: the pokedex dogfood (spec §10). Each server-starting file runs alone.
      - run: cd examples/pokedex && bun test
      - run: cd examples/pokedex && bun run typecheck
      - run: bunx playwright install --with-deps chromium
      - run: bun test --timeout 120000 tests/server/pokedex.test.ts
      - run: bun test --timeout 120000 tests/server/hydrate.chromium.test.ts
      - run: bun build --no-bundle bench/run.ts > /dev/null
      # The exit report is generated: a diff means the committed one is stale.
      - run: bun run m2-exit && git diff --exit-code docs/plans/m2-exit-report.md
      - run: bun test scripts/m2-exit
