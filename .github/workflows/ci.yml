      - run: bun run m2-exit && git diff --exit-code docs/reports/m2-exit-report.md
      - run: bun test scripts/m2-exit
      - run: bun test scripts/release-check.test.ts scripts/core-cf-check.test.ts
      # F264: the generated-names fixture is generated; stale or out of step with the cargo/Chromium tables fails.
      - run: bun test scripts/gen-generated-names.test.ts
      # F438: every tests/server/**/*.test.ts file is a step above or in the root server-test script.
      - run: bun test scripts/ci-wiring.test.ts
