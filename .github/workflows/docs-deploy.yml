name: docs-deploy

# Deploys the docs site (example/docs) to Cloudflare Pages as a STATIC site
# (brust build --ssg → example/docs/dist/static). Root-path hosting on
# <project>.pages.dev satisfies the SSG v1 root-path-only constraint.
#
# Auth: org secrets CF_AID (account id) + CF_AC_TOKEN (API token scoped
# Pages Read/Write).
on:
  push:
    branches: [main]
    paths:
      - 'example/docs/**'
      - '.github/workflows/docs-deploy.yml'
  # Manual runs (first deploy, or after runtime changes that affect the build).
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: build + deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Plain install (not --frozen-lockfile) — same rationale as ci.yml: the
      # brust-<platform> optionalDependencies resolve differently per runner.
      - run: bun install
      # @napi-rs/cli lives in runtime/, not the root (root is not a Bun
      # workspace) — same extra install ci.yml does before build:debug.
      - name: Install runtime build deps (@napi-rs/cli)
        run: cd runtime && bun install

      # The docs build compiles native templates through the napi addon
      # (compileJsx) — build it first, debug profile is fine for build tooling.
      - name: Build napi addon (debug)
        run: cd runtime && bun run build:debug

      - name: Build docs site (SSG)
        run: bun run docs:build

      # Idempotent project bootstrap — create errors when the project already
      # exists, which is the normal steady state.
      - name: Ensure Pages project exists
        run: bunx wrangler pages project create brust-docs --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_AC_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_AID }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_AC_TOKEN }}
          accountId: ${{ secrets.CF_AID }}
          command: pages deploy example/docs/dist/static --project-name=brust-docs --branch=main
