name: release

# Publishes the `brust` npm package + its 6 per-platform native packages
# (brust-darwin-x64 / brust-darwin-arm64 / brust-linux-x64-gnu /
# brust-linux-arm64-gnu / brust-linux-x64-musl / brust-linux-arm64-musl) on a
# `v*` tag — both glibc AND musl Linux (musl enabled by the Aitthi/tokio-uring
# fork that gates statx behind cfg(gnu)). No Windows. WIRE-ONLY until you tag:
# nothing publishes on push to main.
#
# PREREQUISITE (manual, one-time): an `NPM_KEY` repository secret — an npm
# automation token with publish rights to the `brust` name. ALREADY ADDED to
# this repo's Actions secrets. Without it the publish job fails at the .npmrc step.
#
# To cut a release:  npm version <x.y.z> (bumps package.json) → git tag vX.Y.Z →
# git push --tags. The build matrix produces one brust.<triple>.node per target;
# the publish job assembles the per-platform packages (napi artifacts +
# create-npm-dirs + prepublish) and publishes the main package.
#
# NOTE: the publish job is gated to `v*` tags only (see its `if:`), so you can
# run this workflow via workflow_dispatch (Actions → release → Run workflow) to
# exercise the 6-target build matrix + cross-compile (linux-arm64/musl via
# --use-napi-cross) and artifact naming WITHOUT publishing — do that to validate
# before pushing the first real `vX.Y.Z` tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            napi_extra: ""
          - runner: macos-latest
            target: x86_64-apple-darwin
            napi_extra: ""
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            napi_extra: ""
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            napi_extra: "--use-napi-cross"
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            napi_extra: "--use-napi-cross"
          # aarch64-musl: napi-cross ships an aarch64-GNU gcc but no
          # aarch64-MUSL one (the gnu leg above proves napi-cross works; this
          # target failed with "linker aarch64-linux-musl-gcc not found"). Use
          # cargo-zigbuild instead — zig cc bundles musl libc for every arch, so
          # --cross-compile needs no per-target gcc. (x86_64-musl stays on
          # napi-cross; it builds fine and changing a passing leg adds risk.)
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            napi_extra: "--cross-compile"
            setup_zig: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Plain install (not --frozen-lockfile): the brust-<platform> optional
      # deps don't exist on npm until the first publish, and a cold runner under
      # --frozen-lockfile may treat the 404 as fatal. Revisit once published.
      - run: bun install
      - name: Install runtime build deps (@napi-rs/cli)
        run: cd runtime && bun install

      # cargo-zigbuild backs napi's --cross-compile; zig cc provides the musl
      # sysroot per target. Only the aarch64-musl leg sets setup_zig.
      - name: Setup zig (--cross-compile targets)
        if: matrix.setup_zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild (--cross-compile targets)
        if: matrix.setup_zig
        run: cargo install --locked cargo-zigbuild

      # Build the native addon for this target. Reads the ROOT package.json
      # napi config (binaryName: brust) so the output is brust.<triple>.node,
      # matching the per-platform package main + the loader's resolution.
      - name: napi build (release)
        run: >-
          cd runtime &&
          ./node_modules/.bin/napi build
          --platform --release
          --target ${{ matrix.target }}
          ${{ matrix.napi_extra }}
          --js index.js --dts index.d.ts
          --package-json-path ../package.json
          --manifest-path ../crates/brust/Cargo.toml
          --output-dir .

      - name: Upload addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: runtime/brust.*.node
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: build
    # Publish ONLY on a real `v*` tag — never on workflow_dispatch. This lets you
    # exercise the 6-target build matrix manually (Actions → release → Run workflow)
    # to validate the cross-compile WITHOUT claiming the npm name; the actual
    # publish happens only when you push the tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node is what actually runs `npm publish`; Bun installs deps + drives napi.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Plain install (not --frozen-lockfile): the brust-<platform> optional
      # deps don't exist on npm until the first publish, and a cold runner under
      # --frozen-lockfile may treat the 404 as fatal. Revisit once published.
      - run: bun install
      - name: Install runtime build deps (@napi-rs/cli)
        run: cd runtime && bun install

      # The main `brust` package ships the generated loader (runtime/index.js +
      # index.d.ts). A host build emits them (its .node is excluded from the
      # main package's files allowlist, so the host platform doesn't matter).
      - name: Generate JS loader (index.js + index.d.ts)
        run: cd runtime && bun run build

      # Pull every target's brust.<triple>.node back into runtime/.
      - name: Download all addon artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: runtime
          merge-multiple: true

      # Distribute each brust.<triple>.node into the committed npm/<platform>/
      # dirs. (create-npm-dirs already ran at packaging time and the dirs are
      # committed, so we only need to drop the .node files in here.)
      - name: Assemble per-platform packages
        run: |
          ./runtime/node_modules/.bin/napi artifacts \
            --package-json-path package.json \
            --output-dir runtime \
            --npm-dir npm

      - name: Publish
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_KEY}" > ~/.npmrc
          VERSION=$(node -p "require('./package.json').version")
          # Prerelease (0.x.y-alpha) is the de-facto default install until a
          # stable ships, so publish it under `alpha` AND move `latest` onto it
          # below. A stable version (no `-` suffix) publishes to the default
          # `latest` and is NEVER force-tagged `alpha` — that lets npm's normal
          # `latest` semantics stand so a later alpha can't clobber a real
          # stable's `latest`.
          if [[ "$VERSION" == *-* ]]; then TAG=alpha; else TAG=latest; fi
          # Publish the MAIN package FIRST. The unscoped name is the only thing
          # npm's publish-time similarity guard can reject (it rejected `brust`
          # as too close to brfs/must/grunt; the per-platform names are
          # distinctive). If the name is rejected this fails here, BEFORE any
          # platform package is published — so a bad name can't leave orphaned
          # half-published packages (which is exactly what bit the first v* tag).
          npm publish --access public --tag "$TAG"
          # ...only once the name is secured, publish the per-platform packages
          # (the optionalDependencies the loader resolves at runtime).
          ./runtime/node_modules/.bin/napi prepublish -t npm \
            --package-json-path package.json \
            --npm-dir npm
          # `create-brustjs` powers `bun create brustjs <dir>` — a plain package
          # (not a napi platform dir), published last. Its pinned brustjs version
          # resolves the prerelease just published above.
          (cd create-brustjs && npm publish --access public --tag "$TAG")
          # While still in prerelease, point `latest` at this version too, so
          # `npm i brustjs` and `bun create brustjs` (create-brustjs@latest) get
          # the newest alpha by default. npm pins `latest` to the very first
          # publish and a plain `--tag alpha` never moves it — that is exactly
          # why `latest` got stuck at 0.1.0-alpha. Skipped for stable: its
          # publish above already set `latest`.
          if [[ "$VERSION" == *-* ]]; then
            npm dist-tag add brustjs@"$VERSION" latest
            npm dist-tag add create-brustjs@"$VERSION" latest
          fi
        env:
          NPM_KEY: ${{ secrets.NPM_KEY }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_KEY }}
